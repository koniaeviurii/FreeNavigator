<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Mountain Watch 1.1 — preview</title>
<style>
:root{--blue:#12aaff;--glow:#087bd0;--ring:#087ec5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:14px;background:#090d13;color:#eef6ff;font:14px system-ui,Arial;display:flex;flex-direction:column;align-items:center;gap:12px}
h1{font-size:18px;margin:2px}.watch{width:min(94vw,430px);aspect-ratio:1;border-radius:50%;padding:7px;background:linear-gradient(145deg,#d9e4ef,#253446 18%,#05090e 45%,#8394a6 72%,#080c12);box-shadow:0 0 0 2px #101c29,0 0 24px #087bd044;overflow:hidden}
svg{width:100%;height:100%;display:block;border-radius:50%}.panel{width:min(100%,430px);padding:13px;background:#151e29;border:1px solid #304052;border-radius:14px;display:grid;gap:10px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:grid;gap:5px;color:#b8c8d8;font-size:12px}select{width:100%;padding:9px;border-radius:8px;background:#080e16;color:#fff;border:1px solid #40556b;font-size:14px}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toggles label{display:flex;align-items:center;gap:7px;color:#e4edf6;font-size:13px}input{accent-color:var(--blue)}

.color-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.color-grid label{display:grid;grid-template-columns:1fr 54px;align-items:center}.color-grid input{width:54px;height:32px;padding:2px;border:1px solid #40556b;border-radius:7px;background:#080e16}.group-title{font-size:13px;color:#fff;font-weight:700;margin-top:3px}
.note{max-width:430px;margin:0;color:#9cabb9;font-size:12px;line-height:1.45;text-align:center}

#stepsWidget,#pulseWidget,#batteryWidget,#distanceWidget{cursor:grab;touch-action:none}
#stepsWidget:active,#pulseWidget:active,#batteryWidget:active,#distanceWidget:active{cursor:grabbing}
.dragHint{font-size:12px;color:#b8c8d8;text-align:center;margin:0}
</style></head>
<body>
<h1>Mountain Watch · версия 1.1</h1>
<div class="watch">
<svg viewBox="0 0 360 360" role="img" aria-label="Горный циферблат с озером, стрелками и круговыми индикаторами">
<defs>
 <radialGradient id="sky"><stop stop-color="#1468a5"/><stop offset=".72" stop-color="#071c32"/><stop offset="1" stop-color="#02060b"/></radialGradient>
 <linearGradient id="snow" x2="0.8" y2="1"><stop stop-color="#fff"/><stop offset=".42" stop-color="#b8d9ed"/><stop offset="1" stop-color="#41617d"/></linearGradient>
 <linearGradient id="rock" x2="0" y2="1"><stop stop-color="#477a9d"/><stop offset="1" stop-color="#071b2c"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#0b456d"/><stop offset=".55" stop-color="#05243e"/><stop offset="1" stop-color="#010912"/></linearGradient>
 <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".35" stop-color="#91a9c0"/><stop offset=".58" stop-color="#f4fbff"/><stop offset="1" stop-color="#40576e"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="face"><circle cx="180" cy="180" r="173"/></clipPath>
</defs>
<g clip-path="url(#face)">
 <rect width="360" height="360" fill="#02060b"/>
 <circle cx="180" cy="180" r="170" fill="url(#sky)"/>
 <!-- distant clouds and peaks -->
 <g opacity=".55" fill="#b7dcf4"><path d="M12 115q18-15 33 0 17-18 32 0 13-10 25 3H5z"/><path d="M260 103q17-15 31 0 16-17 29 0 13-9 23 4h-88z"/></g>
 <g id="landscape">
  <path d="M-12 211 35 153 59 177 105 105 131 143 174 73 222 145 247 112 291 171 322 137 375 215V282H-12Z" fill="url(#rock)"/>
  <path d="m105 105 13 22 13 16-17-8-11 9-9-12zm69-32 22 37 20 35-27-20-15 13-17-22zm73 39 17 23 20 36-24-18-15 9-12-20z" fill="url(#snow)"/>
  <path d="M-8 220 45 185 83 205 128 159 166 212 212 174 253 214 304 184 372 221V276H-8Z" fill="#102e47"/>
  <path d="M-8 245q55-30 108-6t99 0 103-2 76 8v115H-8Z" fill="url(#water)"/>
  <g stroke="#5db9e9" opacity=".42" stroke-width="1"><path d="M25 263h310M48 276h260M16 291h330M70 309h220M35 328h290"/><path d="M155 246v86m12-90v94m15-92v90m15-87v84"/></g>
  <path d="M0 240q30-19 59-2l22 19 22-11 20 15 20-8 17 14 24-12 24 13 25-18 23 9 25-15 31 13v32H0Z" fill="#06151d"/>
  <g fill="#06130f"><path d="m18 253 8-33 8 33zm13 5 9-41 9 41zm26-2 8-34 8 34zm241 2 9-38 9 38zm22 4 10-45 10 45zm20-2 8-34 8 34z"/></g>
 </g>
 <!-- luminous bezel -->
 <circle cx="180" cy="180" r="168" fill="none" stroke="#91a8bd" stroke-width="2"/>
 <circle cx="180" cy="180" r="160" fill="none" stroke="#078de0" stroke-width="3" filter="url(#glow)"/>
 <circle cx="180" cy="180" r="153" fill="none" stroke="#122c43" stroke-width="8"/>
 <g id="ticks" stroke="#e6f3ff" stroke-linecap="round" filter="url(#glow)"></g>
 <!-- hour numerals -->
 <g fill="#f4f7fb" stroke="#60758a" stroke-width=".7" paint-order="stroke" font-family="Arial" font-weight="800" font-size="29" text-anchor="middle">
  <text x="180" y="42">12</text><text x="318" y="191">3</text><text x="180" y="337">6</text><text x="42" y="191">9</text>
 </g>
 <!-- weather/date capsules -->
 <g font-family="Arial" text-anchor="middle">
  <rect x="112" y="49" width="136" height="34" rx="17" fill="#020914" stroke="#5ebfff" stroke-width="1.3"/>
  <text x="180" y="72" fill="#fff" font-size="18" font-weight="700">☀ +18°C</text>
  <rect x="94" y="87" width="172" height="38" rx="16" fill="#020914" stroke="#5ebfff" stroke-width="1.2"/>
  <text id="date" x="180" y="103" fill="#fff" font-size="10" font-weight="700">12 НОЯБРЯ 2026</text>
  <text id="weekday" x="180" y="118" fill="#18c9ff" font-size="12" font-weight="700">ЧЕТВЕРГ</text>
 </g>
 <!-- circular widgets -->
 <g id="stepsWidget" transform="translate(87 174)">
  <circle r="48" fill="#020a14" stroke="#41617a" stroke-width="2"/><circle r="42" fill="none" stroke="#087fca" stroke-width="5" stroke-dasharray="215 50" transform="rotate(135)" />
  <path d="M-8-18q-9 4-8 13l5 11q4 5 8 0l3-8 7 8q5 3 7-3l-5-14q-3-7-10-7z" fill="#10baff"/>
  <text y="14" fill="#fff" font-size="21" font-weight="800" text-anchor="middle">8427</text><text y="29" fill="#8edaff" font-size="10" text-anchor="middle">ШАГОВ</text>
 </g>
 <g id="pulseWidget" transform="translate(273 174)">
  <circle r="48" fill="#020a14" stroke="#41617a" stroke-width="2"/><circle r="42" fill="none" stroke="#f23b49" stroke-width="5" stroke-dasharray="170 95" transform="rotate(-115)"/>
  <path d="M0-19c-13-16-30 2 0 23 30-21 13-39 0-23" fill="#ff3048"/>
  <text y="14" fill="#fff" font-size="23" font-weight="800" text-anchor="middle">72</text><text y="29" fill="#a9d7f5" font-size="10" text-anchor="middle">УД/МИН</text>
 </g>
 <g id="batteryWidget" transform="translate(105 278)">
  <circle r="31" fill="#020a14" stroke="#42627a" stroke-width="2"/><circle r="26" fill="none" stroke="#53df65" stroke-width="4" stroke-dasharray="140 24" transform="rotate(130)"/>
  <rect x="-9" y="-12" width="18" height="24" rx="3" fill="none" stroke="#61f274" stroke-width="2"/><rect x="-5" y="-16" width="10" height="4" rx="1" fill="#61f274"/><rect x="-6" y="-8" width="12" height="17" fill="#45e45b"/>
  <text y="24" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">78%</text>
 </g>
 <g id="distanceWidget" transform="translate(180 291)">
  <circle r="38" fill="#020a14" stroke="#42627a" stroke-width="2"/><circle r="33" fill="none" stroke="#08aaff" stroke-width="4" stroke-dasharray="165 42" transform="rotate(130)"/>
  <path d="M0-19c-7 0-12 5-12 12 0 9 12 20 12 20S12 2 12-7C12-14 7-19 0-19m0 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10" fill="#10baff"/>
  <text y="18" fill="#fff" font-size="21" font-weight="800" text-anchor="middle">6.8</text><text y="30" fill="#8edaff" font-size="9" text-anchor="middle">КМ</text>
 </g>
 <!-- metallic analog hands over landscape -->
 <g id="hands" stroke-linecap="round">
  <path d="M180 183 L108 131" stroke="#07111d" stroke-width="10"/><path d="M180 180 L108 131" stroke="url(#metal)" stroke-width="7"/>
  <path d="M180 180 L270 129" stroke="#07111d" stroke-width="10"/><path d="M180 180 L270 129" stroke="url(#metal)" stroke-width="7"/>
  <path d="M180 191 L121 276" stroke="#04aaff" stroke-width="2.5"/>
  <circle cx="180" cy="180" r="11" fill="#07111d" stroke="#dcecff" stroke-width="2"/><circle cx="180" cy="180" r="5" fill="#16baff"/>
 </g>
</g>
</svg></div>
<section class="panel">
 <div class="group-title">Индивидуальные цвета</div>
 <div class="color-grid">
  <label>Фон циферблата<input type="color" id="dialColor" value="#02060b"></label><label>Стрелки<input type="color" id="handColor" value="#dceeff"></label>
  <label>Цифры<input type="color" id="numberColor" value="#f4f7fb"></label><label>Деления<input type="color" id="tickColor" value="#e6f3ff"></label>
  <label>Горы<input type="color" id="mountainColor" value="#477a9d"></label><label>Небо и озеро<input type="color" id="sceneColor" value="#1468a5"></label>
  <label>Шаги<input type="color" id="stepsColor" value="#087fca"></label><label>Пульс<input type="color" id="pulseColor" value="#f23b49"></label>
  <label>Батарея<input type="color" id="batteryColor" value="#53df65"></label><label>Расстояние<input type="color" id="distanceColor" value="#08aaff"></label>
 </div>
 <div class="controls">
  <label>Цветовая тема<select id="palette"><option value="blue">Сине-голубая</option><option value="gold">Золотистая</option><option value="violet">Фиолетовая</option><option value="silver">Серебристая</option><option value="green">Зелёная</option><option value="turquoise">Бирюзовая</option></select></label>
  <label>Стиль пейзажа<select id="style"><option value="real">Объёмный</option><option value="art">Художественный</option><option value="line">Контурный</option></select></label>
 </div>
 <div class="toggles">
  <label><input type="checkbox" data-widget="stepsWidget" checked> Шаги</label>
  <label><input type="checkbox" data-widget="pulseWidget" checked> Пульс</label>
  <label><input type="checkbox" data-widget="batteryWidget" checked> Батарея</label>
  <label><input type="checkbox" data-widget="distanceWidget" checked> Расстояние</label>
 </div>

 <p class="dragHint">Чтобы переместить кружок, нажмите на него и перетащите пальцем.</p>
 <button id="resetPositions" type="button">Вернуть кружки на исходные места</button>
</section>
<p class="note">Предварительный визуальный макет Mountain Watch 1.1. Показания датчиков демонстрационные. Это ещё не установочный файл TPK для Galaxy Watch SM‑R800.</p>
<script>
const ns='http://www.w3.org/2000/svg',tg=document.getElementById('ticks');
for(let i=0;i<60;i++){let a=i*Math.PI/30-Math.PI/2,r=i%5===0?145:150,x1=180+Math.cos(a)*r,y1=180+Math.sin(a)*r,x2=180+Math.cos(a)*158,y2=180+Math.sin(a)*158,l=document.createElementNS(ns,'line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('stroke-width',i%5===0?3:1.2);tg.appendChild(l)}
document.querySelectorAll('[data-widget]').forEach(c=>c.addEventListener('change',()=>document.getElementById(c.dataset.widget).style.display=c.checked?'':'none'));
const themes={blue:['#12aaff','#087bd0'],gold:['#ffc15c','#a96819'],violet:['#c38aff','#7042ad'],silver:['#e4efff','#8097b0'],green:['#7de68a','#278d48'],turquoise:['#65e6dc','#168f91']};
document.getElementById('palette').addEventListener('change',e=>{let p=themes[e.target.value];document.documentElement.style.setProperty('--blue',p[0]);document.documentElement.style.setProperty('--glow',p[1]);document.querySelectorAll('#ticks line').forEach(x=>x.setAttribute('stroke',p[0]));document.querySelectorAll('#hands path:last-of-type').forEach(x=>x.setAttribute('stroke',p[0]));document.querySelectorAll('#stepsWidget circle:nth-child(2),#distanceWidget circle:nth-child(2)').forEach(x=>x.setAttribute('stroke',p[0]));});
document.getElementById('style').addEventListener('change',e=>{const l=document.getElementById('landscape');l.style.filter=e.target.value==='art'?'saturate(1.6) contrast(1.12)':e.target.value==='line'?'grayscale(1) contrast(1.8)':'none';});

const defaultPositions={stepsWidget:[87,174],pulseWidget:[273,174],batteryWidget:[105,278],distanceWidget:[180,291]};
const savedPositions=(()=>{try{return JSON.parse(localStorage.getItem('mountainWatchPositions')||'{}')}catch(_){return {}}})();
function setWidgetPosition(id,x,y){const g=document.getElementById(id);g.setAttribute('transform',`translate(${x} ${y})`)}
Object.entries(defaultPositions).forEach(([id,pos])=>{const p=savedPositions[id];if(Array.isArray(p)&&p.length===2&&p.every(Number.isFinite))setWidgetPosition(id,p[0],p[1])});
let dragging=null;
function svgPoint(evt){const pt=document.querySelector('svg').createSVGPoint();pt.x=evt.clientX;pt.y=evt.clientY;return pt.matrixTransform(document.querySelector('svg').getScreenCTM().inverse())}
function clampWidget(x,y,id){const radius=id==='stepsWidget'||id==='pulseWidget'?48:id==='distanceWidget'?38:31;const max=170-radius-3;const dx=x-180,dy=y-180,len=Math.hypot(dx,dy);if(len>max){x=180+dx/len*max;y=180+dy/len*max}return [Math.max(radius+5,Math.min(360-radius-5,x)),Math.max(radius+5,Math.min(360-radius-5,y))]}
Object.keys(defaultPositions).forEach(id=>{const g=document.getElementById(id);g.addEventListener('pointerdown',e=>{e.preventDefault();g.setPointerCapture(e.pointerId);const p=svgPoint(e);const m=(g.getAttribute('transform')||'').match(/translate\(([-\d.]+)[ ,]+([-\d.]+)\)/);const x=m?Number(m[1]):defaultPositions[id][0],y=m?Number(m[2]):defaultPositions[id][1];dragging={id,dx:x-p.x,dy:y-p.y}});g.addEventListener('pointermove',e=>{if(!dragging||dragging.id!==id)return;const p=svgPoint(e),xy=clampWidget(p.x+dragging.dx,p.y+dragging.dy,id);setWidgetPosition(id,xy[0],xy[1])});const stop=()=>{if(dragging&&dragging.id===id){const m=(g.getAttribute('transform')||'').match(/translate\(([-\d.]+)[ ,]+([-\d.]+)\)/);if(m){savedPositions[id]=[Number(m[1]),Number(m[2])];try{localStorage.setItem('mountainWatchPositions',JSON.stringify(savedPositions))}catch(_){}}dragging=null}};g.addEventListener('pointerup',stop);g.addEventListener('pointercancel',stop)});
document.getElementById('resetPositions').addEventListener('click',()=>{Object.entries(defaultPositions).forEach(([id,p])=>setWidgetPosition(id,p[0],p[1]));try{localStorage.removeItem('mountainWatchPositions')}catch(_){}});


const colorDefaults={dialColor:'#02060b',handColor:'#dceeff',numberColor:'#f4f7fb',tickColor:'#e6f3ff',mountainColor:'#477a9d',sceneColor:'#1468a5',stepsColor:'#087fca',pulseColor:'#f23b49',batteryColor:'#53df65',distanceColor:'#08aaff'};
function applyColor(id,value){
 const svg=document.querySelector('svg');
 if(id==='dialColor'){svg.querySelector('#face').setAttribute('fill',value);svg.querySelector('g[clip-path] > rect').setAttribute('fill',value)}
 if(id==='handColor'){document.querySelectorAll('#hands path').forEach((el,i)=>{if(i<2)el.setAttribute('fill',value);else el.setAttribute('stroke',value)});document.querySelector('#hands circle:last-child').setAttribute('fill',value)}
 if(id==='numberColor')document.querySelectorAll('svg g[clip-path] text').forEach(t=>t.setAttribute('fill',value));
 if(id==='tickColor')document.querySelectorAll('#ticks line').forEach(el=>el.setAttribute('stroke',value));
 if(id==='mountainColor')document.querySelectorAll('#landscape path').forEach((el,i)=>{if(i<4)el.setAttribute('fill',value)});
 if(id==='sceneColor'){document.querySelector('#sky stop').setAttribute('stop-color',value);document.querySelectorAll('#water stop').forEach(el=>el.setAttribute('stop-color',value))}
 const wm={stepsColor:'stepsWidget',pulseColor:'pulseWidget',batteryColor:'batteryWidget',distanceColor:'distanceWidget'};
 if(wm[id]){const g=document.getElementById(wm[id]),ring=g.querySelector('circle:nth-child(2)');if(ring)ring.setAttribute('stroke',value);g.querySelectorAll('path,rect').forEach(el=>{if(el.getAttribute('fill')&&el.getAttribute('fill')!=='none')el.setAttribute('fill',value)})}
}
Object.keys(colorDefaults).forEach(id=>{const input=document.getElementById(id);let saved=null;try{saved=localStorage.getItem('mountainWatchColor_'+id)}catch(_){}if(saved&&/^#[0-9a-f]{6}$/i.test(saved))input.value=saved;applyColor(id,input.value);input.addEventListener('input',()=>{applyColor(id,input.value);try{localStorage.setItem('mountainWatchColor_'+id,input.value)}catch(_){}})});

function clock(){const d=new Date();document.getElementById('date').textContent=d.toLocaleDateString('ru-RU',{day:'2-digit',month:'long',year:'numeric'}).toUpperCase();document.getElementById('weekday').textContent=d.toLocaleDateString('ru-RU',{weekday:'long'}).toUpperCase()}clock();
</script></body></html>

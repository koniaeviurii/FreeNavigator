<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Mountain Watch 1.1</title>
<style>
:root{--dial:#07111c;--hand:#dceeff;--mountain:#68b5dc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:#090d13;color:#eef6ff;font:14px system-ui,Arial;display:flex;flex-direction:column;align-items:center;gap:12px}
h1{font-size:18px;margin:2px}.watch{width:min(96vw,440px);aspect-ratio:1;border-radius:50%;padding:7px;background:linear-gradient(145deg,#e6f0fa,#25384b 18%,#05090e 48%,#9aabba 76%,#080c12);box-shadow:0 0 0 2px #101c29,0 0 25px #087bd044;overflow:hidden}
svg{width:100%;height:100%;display:block;border-radius:50%}.panel{width:min(100%,440px);padding:13px;background:#151e29;border:1px solid #304052;border-radius:14px;display:grid;gap:11px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:grid;gap:5px;color:#c3d2e0;font-size:12px}select,input[type=color]{width:100%;min-height:36px;padding:5px;border-radius:8px;background:#080e16;color:#fff;border:1px solid #40556b;font-size:13px}input[type=color]{padding:3px}.group-title{font-size:13px;color:#fff;font-weight:700;margin-top:2px}.widget-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.widget-grid label{grid-template-columns:1fr 74px;align-items:center}.widget-grid label span{grid-column:1/-1}.note{max-width:440px;margin:0;color:#9cabb9;font-size:12px;line-height:1.45;text-align:center}
</style></head>
<body>
<h1>Mountain Watch · 1.1</h1>
<div class="watch">
<svg viewBox="0 0 360 360" role="img" aria-label="Стрелочные часы с цветными заснеженными горами, озером и четырьмя градиентными индикаторами">
<defs>
 <radialGradient id="dialGrad"><stop stop-color="#18344a"/><stop offset=".68" stop-color="#0b1c2b"/><stop offset="1" stop-color="#02070d"/></radialGradient>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#164b78"/><stop offset=".56" stop-color="#5b9dc0"/><stop offset="1" stop-color="#e2c7a2"/></linearGradient>
 <linearGradient id="snow" x2=".25" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#d9f0ff"/><stop offset="1" stop-color="#7f9fb5"/></linearGradient>
 <linearGradient id="mountainRock" x2="0" y2="1"><stop stop-color="#6d9bb0"/><stop offset=".55" stop-color="#426779"/><stop offset="1" stop-color="#1a3946"/></linearGradient>
 <linearGradient id="lake" x2="0" y2="1"><stop stop-color="#77c7e4"/><stop offset=".35" stop-color="#267fa7"/><stop offset="1" stop-color="#092f4b"/></linearGradient>
 <linearGradient id="handMetal" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".3" stop-color="var(--hand)"/><stop offset=".55" stop-color="#71899e"/><stop offset=".78" stop-color="#f5fbff"/><stop offset="1" stop-color="#43586d"/></linearGradient>
 <linearGradient id="batteryGrad"><stop stop-color="#9ce8ff"/><stop offset=".5" stop-color="#269de8"/><stop offset="1" stop-color="#07518e"/></linearGradient>
 <linearGradient id="pulseGrad"><stop stop-color="#ffb0a9"/><stop offset=".5" stop-color="#f04454"/><stop offset="1" stop-color="#8f102a"/></linearGradient>
 <linearGradient id="stepsGrad"><stop stop-color="#c4ff9c"/><stop offset=".5" stop-color="#55d66c"/><stop offset="1" stop-color="#167b45"/></linearGradient>
 <linearGradient id="distanceGrad"><stop stop-color="#fff0a0"/><stop offset=".5" stop-color="#f4bd43"/><stop offset="1" stop-color="#a96a16"/></linearGradient>
 <filter id="softGlow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="2"/></filter>
 <clipPath id="face"><circle cx="180" cy="180" r="173"/></clipPath>
</defs>
<g clip-path="url(#face)">
 <rect width="360" height="360" fill="var(--dial)"/>
 <circle cx="180" cy="180" r="169" fill="url(#dialGrad)"/>
 <g id="scenery">
  <rect x="18" y="38" width="324" height="284" fill="url(#sky)" opacity=".97"/>
  <!-- delicate clouds -->
  <g fill="#f4fbff" opacity=".8">
   <path d="M47 105q-2-12 11-15 8-17 24-5 13-1 16 13 12 0 12 9H47z"/>
   <path d="M247 91q0-11 12-13 8-15 22-5 13-2 16 11 12 1 13 10h-63z"/>
   <path d="M153 83q-1-8 9-10 6-11 17-4 10-1 12 9h-38z" opacity=".65"/>
  </g>
  <!-- far ridges -->
  <path d="M10 202 56 151 83 177 124 117 151 155 188 99 220 147 252 119 291 171 319 140 365 203v65H10z" fill="#547f91"/>
  <path d="m124 117 13 21 14 17-18-8-11 12-10-12zm64-18 18 28 14 20-23-13-13 11-14-19zm64 20 15 19 17 25-22-12-14 8-12-19z" fill="url(#snow)"/>
  <!-- main colorful snowy mountains -->
  <path d="M-5 231 40 176 68 199 111 128 143 171 183 91 226 161 254 132 296 191 326 158 370 225v72H-5z" fill="url(#mountainRock)"/>
  <path d="m111 128 15 22 17 21-20-8-13 12-12-15zm72-37 22 38 21 32-27-17-17 14-18-25zm71 41 18 22 23 37-28-17-15 12-15-24z" fill="url(#snow)"/>
  <path d="m183 91 8 30-13 7-9-9-12 14 16-30zM111 128l8 22-12 7-9-8-8 10 15-31z" fill="#fff" opacity=".95"/>
  <!-- foothills and pine forest -->
  <path d="M-4 226q34-35 70-12 30-30 63-4 34-24 65 3 36-28 70-1 34-28 101 15v67H-4z" fill="#244c43"/>
  <g fill="#102e2a">
   <path d="m15 265 10-48 10 48zm22 5 12-57 12 57zm26-3 10-44 10 44zm36 3 12-55 12 55zm28-2 11-48 11 48zm143 1 12-54 12 54zm26 3 12-61 12 61zm27-4 10-48 10 48zm23 5 12-58 12 58z"/>
  </g>
  <path d="M-5 252q48-19 94-2 40-16 84 0 47-18 91 1 47-16 101 2v78H-5z" fill="url(#lake)"/>
  <!-- lake reflections -->
  <g stroke="#b8e8f4" opacity=".45" stroke-linecap="round"><path d="M75 268h205M98 280h164M54 293h248M113 306h134M38 319h285" stroke-width="1.4"/><path d="M170 258h20m-35 10h49m-63 12h77m-56 12h42" stroke-width="2"/></g>
  <path d="M-5 246q33-15 68 3l22 10 22-7 24 12 23-5 18 11 22-9 22 8 24-13 23 8 25-13 32 9v28H-5z" fill="#14392f" opacity=".9"/>
 </g>
 <!-- top information: unframed -->
 <g font-family="Arial" text-anchor="middle" font-weight="700">
  <text id="weekday" x="180" y="23" fill="#fff" font-size="11" letter-spacing=".7">ЧЕТВЕРГ</text>
  <text id="date" x="180" y="37" fill="#fff" font-size="10">12 НОЯБРЯ 2026</text>
  <text x="180" y="56" fill="#fff" font-size="13">☀  +18°C</text>
 </g>
 <!-- applied hour positions are independently adjustable -->
 <g id="batteryWidget" transform="translate(91 104)">
  <circle r="27" fill="#06101c" opacity=".9" stroke="#b4eaff" stroke-width="1.5"/>
  <circle r="23" fill="none" stroke="url(#batteryGrad)" stroke-width="6"/>
  <rect x="-7" y="-11" width="14" height="19" rx="2.5" fill="none" stroke="#c7efff" stroke-width="1.8"/><rect x="-4" y="-14" width="8" height="3" rx="1" fill="#c7efff"/><rect x="-4.5" y="-7" width="9" height="11" rx="1" fill="#39b7ff"/>
  <text y="19" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">78%</text>
 </g>
 <g id="pulseWidget" transform="translate(269 104)">
  <circle r="27" fill="#1b0911" opacity=".92" stroke="#ffb3b8" stroke-width="1.5"/><circle r="23" fill="none" stroke="url(#pulseGrad)" stroke-width="6"/>
  <path d="M0-12c-8-10-19 2 0 17 19-15 8-27 0-17" fill="#ff5364"/>
  <text y="19" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">72 уд/м</text>
 </g>
 <g id="stepsWidget" transform="translate(91 258)">
  <circle r="27" fill="#07170d" opacity=".94" stroke="#baffb8" stroke-width="1.5"/><circle r="23" fill="none" stroke="url(#stepsGrad)" stroke-width="6"/>
  <path d="M-5-12q-7 3-6 9l4 8q3 4 6 0l2-6 5 6q4 2 6-2l-4-11q-2-5-7-5z" fill="#8bff91"/>
  <text y="19" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">8427</text>
 </g>
 <g id="distanceWidget" transform="translate(269 258)">
  <circle r="27" fill="#1b1406" opacity=".94" stroke="#ffe5a0" stroke-width="1.5"/><circle r="23" fill="none" stroke="url(#distanceGrad)" stroke-width="6"/>
  <path d="M0-14c-6 0-10 4-10 10 0 7 10 17 10 17S10 3 10-4C10-10 6-14 0-14m0 5a4 4 0 1 1 0 8 4 4 0 0 1 0-8" fill="#ffd15d"/>
  <text y="19" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">6.8 км</text>
 </g>
 <!-- classic analog dial markers -->
 <circle cx="180" cy="180" r="153" fill="none" stroke="#9fc6dd" stroke-width="1.4" opacity=".8"/>
 <g id="ticks" stroke="#f4fbff" stroke-linecap="round"></g>
 <g fill="#fff" stroke="#536d80" stroke-width=".8" paint-order="stroke" font-family="Arial" font-weight="800" font-size="24" text-anchor="middle">
  <text x="180" y="81">12</text><text x="299" y="188">3</text><text x="180" y="310">6</text><text x="61" y="188">9</text>
 </g>
 <!-- thick, dimensional hands: real analog movement -->
 <g id="hourHand" transform="rotate(35 180 180)">
  <path d="M180 194 L173 184 L174 119 Q180 106 186 119 L187 184Z" fill="#091522" opacity=".8" transform="translate(2 3)"/>
  <path d="M180 194 L173 184 L174 119 Q180 106 186 119 L187 184Z" fill="url(#handMetal)" stroke="#263e54" stroke-width="1"/>
  <path d="M180 120L180 183" stroke="#fff" stroke-width="1.5" opacity=".8"/>
 </g>
 <g id="minuteHand" transform="rotate(125 180 180)">
  <path d="M180 198 L175 187 L177 76 Q180 67 183 76 L185 187Z" fill="#07121d" opacity=".85" transform="translate(2 3)"/>
  <path d="M180 198 L175 187 L177 76 Q180 67 183 76 L185 187Z" fill="url(#handMetal)" stroke="#263e54" stroke-width="1"/>
  <path d="M180 78L180 185" stroke="#fff" stroke-width="1.2" opacity=".85"/>
 </g>
 <g id="secondHand" transform="rotate(210 180 180)">
  <path d="M180 207V66" stroke="#052039" stroke-width="4" stroke-linecap="round"/>
  <path d="M180 205V66" stroke="#21baff" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="180" cy="66" r="3" fill="#6bd7ff"/>
 </g>
 <circle cx="180" cy="180" r="10" fill="#101d2a" stroke="#e7f5ff" stroke-width="2"/><circle cx="180" cy="180" r="4" fill="#25baff"/>
 <!-- outer metallic bezel -->
 <circle cx="180" cy="180" r="168" fill="none" stroke="#d5e3ef" stroke-width="2"/>
 <circle cx="180" cy="180" r="162" fill="none" stroke="#168ecb" stroke-width="2" filter="url(#softGlow)"/>
</g>
</svg></div>
<section class="panel">
 <div class="group-title">Независимая настройка цветов</div>
 <div class="controls">
  <label>Фон циферблата<input type="color" id="dialColor" value="#07111c"></label>
  <label>Стрелки<input type="color" id="handColor" value="#dceeff"></label>
  <label>Горы<input type="color" id="mountainColor" value="#68b5dc"></label>
  <label>Небо и озеро<input type="color" id="sceneColor" value="#3c91bd"></label>
 </div>
 <div class="group-title">Цвет каждого индикатора</div>
 <div class="controls">
  <label>Заряд батареи<input type="color" id="batteryColor" value="#269de8"></label>
  <label>Пульс<input type="color" id="pulseColor" value="#f04454"></label>
  <label>Количество шагов<input type="color" id="stepsColor" value="#55d66c"></label>
  <label>Расстояние<input type="color" id="distanceColor" value="#f4bd43"></label>
 </div>
 <div class="group-title">Положение индикаторов</div>
 <div class="controls">
  <label>Батарея<select data-position="batteryWidget"><option value="91,104" selected>10–11 часов</option><option value="75,140">9–10 часов</option><option value="105,75">11–12 часов</option><option value="125,115">10 часов</option></select></label>
  <label>Пульс<select data-position="pulseWidget"><option value="269,104" selected>1–2 часа</option><option value="285,140">2–3 часа</option><option value="255,75">12–1 час</option><option value="235,115">2 часа</option></select></label>
  <label>Шаги<select data-position="stepsWidget"><option value="91,258" selected>7–8 часов</option><option value="75,220">8–9 часов</option><option value="105,285">6–7 часов</option><option value="125,245">7 часов</option></select></label>
  <label>Расстояние<select data-position="distanceWidget"><option value="269,258" selected>4–5 часов</option><option value="285,220">3–4 часа</option><option value="255,285">5–6 часов</option><option value="235,245">5 часов</option></select></label>
 </div>
</section>
<p class="note">Стрелочный макет Mountain Watch 1.1. Время и дата идут от часов телефона; показания погоды и датчиков пока демонстрационные. Это веб-предпросмотр, не установочный TPK для Galaxy Watch SM‑R800.</p>
<script>
const ns='http://www.w3.org/2000/svg',ticks=document.getElementById('ticks');
for(let i=0;i<60;i++){const a=i*Math.PI/30-Math.PI/2,r=i%5===0?144:149,x1=180+Math.cos(a)*r,y1=180+Math.sin(a)*r,x2=180+Math.cos(a)*157,y2=180+Math.sin(a)*157,l=document.createElementNS(ns,'line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('stroke-width',i%5===0?2.6:1);ticks.appendChild(l)}
function setVar(id,variable){document.getElementById(id).addEventListener('input',e=>document.documentElement.style.setProperty(variable,e.target.value))}
setVar('dialColor','--dial');setVar('handColor','--hand');
document.getElementById('mountainColor').addEventListener('input',e=>{document.getElementById('scenery').style.filter='hue-rotate('+((parseInt(e.target.value.slice(1,3),16)-104)*1.2)+'deg) saturate(1.12)'});
document.getElementById('sceneColor').addEventListener('input',e=>{document.getElementById('scenery').style.filter='hue-rotate('+((parseInt(e.target.value.slice(1,3),16)-60)*1.1)+'deg) saturate(1.15)'});
const widgetColors={batteryWidget:['batteryColor','url(#batteryGrad)','#269de8'],pulseWidget:['pulseColor','url(#pulseGrad)','#f04454'],stepsWidget:['stepsColor','url(#stepsGrad)','#55d66c'],distanceWidget:['distanceColor','url(#distanceGrad)','#f4bd43']};
Object.entries(widgetColors).forEach(([widget,[input,gradient,initial]])=>document.getElementById(input).addEventListener('input',e=>{const g=document.querySelector('#'+widget+' circle:nth-child(2)');g.setAttribute('stroke',e.target.value);g.removeAttribute('stroke-dasharray');document.querySelectorAll('#'+widget+' path,#'+widget+' rect').forEach(el=>{if(el.getAttribute('fill')&&el.getAttribute('fill')!=='none')el.setAttribute('fill',e.target.value)})}));
document.querySelectorAll('[data-position]').forEach(s=>s.addEventListener('change',e=>document.getElementById(e.target.dataset.position).setAttribute('transform','translate('+e.target.value+')')));
function tick(){const d=new Date(),sec=d.getSeconds()+d.getMilliseconds()/1000,min=d.getMinutes()+sec/60,hr=(d.getHours()%12)+min/60;document.getElementById('secondHand').setAttribute('transform','rotate('+sec*6+' 180 180)');document.getElementById('minuteHand').setAttribute('transform','rotate('+min*6+' 180 180)');document.getElementById('hourHand').setAttribute('transform','rotate('+hr*30+' 180 180)');document.getElementById('weekday').textContent=d.toLocaleDateString('ru-RU',{weekday:'long'}).toLocaleUpperCase('ru-RU');document.getElementById('date').textContent=d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}).toLocaleUpperCase('ru-RU')}
tick();setInterval(tick,250);
</script></body></html>

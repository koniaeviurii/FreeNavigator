name: FreeNavigator Android build

on:
  workflow_dispatch:
  push:
    branches: [ build-check-0.4.0 ]

permissions:
  contents: read

concurrency:
  group: freenavigator-android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify project structure
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin

      - name: Build debug APK with Wrapper
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeNavigator-0.5.12-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package complete source with Gradle Wrapper
        run: |
          zip -r FreeNavigator-0.5.12-source.zip . \
            -x ".git/*" ".gradle/*" "app/build/*" "build/*" \
               "FreeNavigator-*.zip" "*.zip"

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: FreeNavigator-0.5.12-source
          path: FreeNavigator-0.5.12-source.zip
          if-no-files-found: error
          retention-days: 14
